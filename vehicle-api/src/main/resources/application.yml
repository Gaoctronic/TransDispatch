# 应用配置。
# 与 Python 版本保持一致：所有配置项都可以通过环境变量覆盖，且都有安全默认值。

spring:
  application:
    name: vehicle-api
  jackson:
    # 等价于 Pydantic 的 extra="forbid"：请求体里出现未知字段直接报错（422）
    deserialization:
      fail-on-unknown-properties: true
    # 时间统一序列化为 ISO 8601 字符串，而不是时间戳数字
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true

server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:8000}

app:
  name: ${APP_NAME:vehicle-api}
  version: ${APP_VERSION:1.0.0}
  debug: ${DEBUG:false}

api:
  prefix: ${API_PREFIX:/api/v1}

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /docs

logging:
  level:
    root: INFO
